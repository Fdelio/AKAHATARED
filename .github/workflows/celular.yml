# Arma las apps para celular. Se corre a mano desde la pestaña "Actions" de GitHub
# (botón "Run workflow"), y también en cada PR para comprobar que todo compila.
#
# Android: siempre deja un APK de prueba para instalar en un celular. Si GitHub tiene
# los secretos de firma, deja además el archivo .aab que se sube a Google Play.
# iOS: comprueba que la app compila en una Mac de GitHub (sin firma). Para subirla a la
# App Store hace falta la cuenta de Apple Developer (ver docs/publicar-en-tiendas.md).
name: Apps para celular

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/celular.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: APK de prueba (para instalar en un celular Android)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-de-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar la firma (si hay secretos)
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subida.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/subida.jks" >> "$GITHUB_ENV"
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "Sin secretos de firma: solo se arma el APK de prueba."
          fi
      - name: Archivo para Google Play (.aab firmado)
        if: steps.firma.outputs.hay == 'si'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - if: steps.firma.outputs.hay == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: android-para-google-play
          path: android/app/build/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Compilar para el simulador (sin firma)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
